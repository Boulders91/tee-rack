<style>
  :root{
    --bg:#1b1713; --bg-soft:#241f1a; --cotton:#ece7da; --cotton-dim:#d8d2c2;
    --ink:#17151f; --accent:#ff4b2e; --chalk:#8fb7cc; --line:#3a332b; --faint:#9a9083; --ok:#7fc97f;
    --display:'Archivo Black','Arial Black',Impact,sans-serif;
    --body:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--cotton);font-family:var(--body);min-height:100vh;padding-bottom:40px}
  .wrap{max-width:430px;margin:0 auto;padding:18px 16px 0}
  button{font-family:var(--body);cursor:pointer}
  button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
  .hdr{display:flex;justify-content:space-between;align-items:baseline}
  .brand{font-family:var(--display);font-size:17px;letter-spacing:.04em}
  .brand span{color:var(--accent)}
  .count{font-size:11px;color:var(--faint)}
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px}
  .bar>div{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
  .sync{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg-soft)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
  .dot.on{background:var(--ok)} .dot.err{background:var(--accent)}
  .sync .st{font-size:11px;color:var(--faint);flex:1}
  .sync input{flex:2;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--cotton);font-size:12px;padding:7px 8px;font-family:var(--body)}
  .sync .go{padding:7px 10px;border-radius:5px;border:1px solid var(--chalk);background:transparent;color:var(--chalk);font-size:11px;font-weight:700}
  .daynav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .arrow{background:none;border:1.5px solid var(--line);color:var(--cotton);width:42px;height:42px;border-radius:6px;font-size:18px}
  .arrow:disabled{color:var(--line);cursor:default}
  .daydate{font-family:var(--display);font-size:22px;letter-spacing:.06em;text-align:center}
  .daydate small{color:var(--chalk);font-size:14px;font-family:var(--display)}
  .daymeta{font-size:10px;color:var(--faint);letter-spacing:.12em;text-align:center}
  .teewrap{position:relative;width:100%;max-width:340px;margin:10px auto 0}
  .teewrap svg{width:100%;display:block;filter:drop-shadow(0 14px 24px rgba(0,0,0,.45))}
  .print{position:absolute;top:26%;left:26%;width:48%;height:56%;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-1.2deg)}
  .print div{font-family:var(--display);line-height:1.14;color:var(--ink);letter-spacing:.01em;text-transform:uppercase;word-break:break-word}
  .ctx{margin-top:6px;text-align:center;padding:0 6px;font-size:13.5px;line-height:1.5;color:var(--cotton-dim)}
  .src{display:inline-block;margin-top:8px;font-size:12px;color:var(--chalk);text-decoration:none;border-bottom:1px solid var(--chalk);padding-bottom:1px}
  .ticket{margin-top:18px;background:var(--bg-soft);border:1px solid var(--line);border-radius:10px;padding:14px 14px 16px}
  .ticket-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .ticket-hd .lbl{font-size:10px;letter-spacing:.16em;color:var(--faint)}
  .ticket-hd .saved{font-size:10px;color:var(--accent);letter-spacing:.1em}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .row .lab{width:72px;flex-shrink:0}
  .row .lab b{display:block;font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--cotton)}
  .row .lab i{font-style:normal;font-size:10px;color:var(--faint)}
  .pills{display:flex;gap:6px;flex:1;justify-content:flex-end}
  .pill{width:38px;height:38px;border-radius:4px;border:1.5px solid var(--line);background:transparent;color:var(--cotton-dim);font-weight:700;font-size:15px}
  .pill.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .wearbtn{width:60px;height:38px;border-radius:4px;border:1.5px solid var(--line);background:transparent;color:var(--cotton-dim);font-weight:700;font-size:14px}
  .wearbtn.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .tags-lbl{font-size:10px;letter-spacing:.14em;color:var(--faint);margin:12px 0 8px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--faint);font-size:11px;letter-spacing:.04em}
  .tag.on{border-color:var(--chalk);background:rgba(143,183,204,.15);color:var(--chalk)}
  .ck{display:flex;gap:8px;margin-top:14px}
  .ck button{flex:1;height:44px;border-radius:6px;border:1.5px solid var(--line);background:transparent;color:var(--cotton-dim);font-weight:700;font-size:13px}
  .ck .crown.on{border-color:#e8b93b;background:rgba(232,185,59,.16);color:#e8b93b}
  .ck .kill.on{border-color:var(--accent);background:rgba(255,75,46,.14);color:var(--accent)}
  .foot{display:flex;gap:8px;margin-top:14px}
  .nextbtn{flex:1.4;height:48px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-family:var(--display);font-size:13px;letter-spacing:.06em}
  .copybtn{flex:1;height:48px;border-radius:6px;border:1.5px solid var(--line);background:transparent;color:var(--cotton);font-size:12px;font-weight:700}
  .copybtn.done{color:var(--chalk)}
  .note{margin-top:16px;text-align:center;font-size:10.5px;color:var(--faint);line-height:1.6}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  { id:"2026-06-14", date:"JUN 14", dow:"SUN", slogan:"53 YEARS. BRUNSON 45. KNICKS FOREVER.", context:"Brunson dropped a Finals-record 45 in Game 5 as the Knicks beat the Spurs for their first title since 1973.", url:"https://www.nba.com/news/how-the-knicks-won-the-2026-nba-championship", source:"NBA.com" },
  { id:"2026-05-07", date:"MAY 7", dow:"THU", slogan:"\u201CIT WAS JUST A LOVE TAP\u201D — U.S. FOREIGN POLICY, 2026", context:"Trump described U.S. strikes on Iran as a 'love tap' and insisted the ceasefire was still in effect.", url:"https://en.wikipedia.org/wiki/7_May_2026_United_States_strikes_on_Iran", source:"Wikipedia" }
];

const TAGS = ["MORE-SPORTS","MORE-MARKETS","MORE-POLITICS","MORE-MEME","LESS-TECH","TOO-LONG","TOO-NICHE","WRONG-STORY"];
const KEY = "tee-day-ratings-v1";
const TKEY = "tee-gh-token";

let state = { idx: 0, ratings: {} };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const p = JSON.parse(raw);
    if (p && typeof p === "object") {
      if (p.ratings) state.ratings = p.ratings;
      if (typeof p.idx === "number" && p.idx >= 0 && p.idx < DAYS.length) state.idx = p.idx;
    }
  }
} catch (e) {}

/* ---------------- GitHub sync layer ---------------- */
let token = "";
try { token = localStorage.getItem(TKEY) || ""; } catch(e){}
let pushTimer = null, fileSha = null;

const apiUrl = () => "https://api.github.com/repos/" + CONFIG.owner + "/" + CONFIG.repo + "/contents/" + CONFIG.path;
const ghHeaders = (t) => {
  const h = { "Accept": "application/vnd.github+json" };
  if (t) h["Authorization"] = "Bearer " + t;
  return h;
};
function setSyncStatus(mode, msg){
  const dot = document.getElementById("dot"), st = document.getElementById("syncst");
  dot.className = "dot" + (mode === "on" ? " on" : mode === "err" ? " err" : "");
  st.textContent = msg;
}
function b64encodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64decodeUnicode(str){
  return decodeURIComponent(escape(atob(str.replace(/\n/g,""))));
}
async function pullRemote(){
  try {
    const res = await fetch(apiUrl() + "?ref=" + CONFIG.branch, { headers: ghHeaders(token) });
    if (!res.ok) { if (res.status !== 404) setSyncStatus(token ? "err" : "", token ? "sync err " + res.status : "local only"); return; }
    const j = await res.json();
    fileSha = j.sha;
    const remote = JSON.parse(b64decodeUnicode(j.content || "") || "{}");
    if (remote && remote.ratings) {
      // remote hydrates anything local doesn't have; local edits win
      state.ratings = Object.assign({}, remote.ratings, state.ratings);
      saveLocal(); render();
    }
    if (token) setSyncStatus("on", "synced");
  } catch (e) { if (token) setSyncStatus("err", "sync err"); }
}
function schedulePush(){
  if (!token) return;
  setSyncStatus("", "saving…");
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(pushRemote, 1500);
}
async function pushRemote(retry){
  if (!token) return;
  const payload = JSON.stringify({ updated: new Date().toISOString(), ratings: state.ratings }, null, 2);
  try {
    if (fileSha === null) {
      const head = await fetch(apiUrl() + "?ref=" + CONFIG.branch, { headers: ghHeaders(token) });
      if (head.ok) fileSha = (await head.json()).sha; else fileSha = undefined;
    }
    const body = { message: "ratings update", content: b64encodeUnicode(payload), branch: CONFIG.branch };
    if (fileSha) body.sha = fileSha;
    const res = await fetch(apiUrl(), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(token)), body: JSON.stringify(body) });
    if (res.ok) {
      const j = await res.json();
      fileSha = j.content && j.content.sha;
      setSyncStatus("on", "synced " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
    } else if ((res.status === 409 || res.status === 422) && !retry) {
      fileSha = null; return pushRemote(true);
    } else if (res.status === 401 || res.status === 403) {
      setSyncStatus("err", "token rejected — repaste");
    } else {
      setSyncStatus("err", "sync err " + res.status);
    }
  } catch (e) { setSyncStatus("err", "offline — saved locally"); }
}
document.getElementById("tokgo").onclick = () => {
  const v = document.getElementById("tok").value.trim();
  if (!v) return;
  token = v;
  try { localStorage.setItem(TKEY, v); } catch(e){}
  document.getElementById("tok").value = "";
  document.getElementById("tok").placeholder = "token saved on this device";
  setSyncStatus("", "connecting…");
  pullRemote().then(() => pushRemote());
};

function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function save(){ saveLocal(); schedulePush(); }
function cur(){ return DAYS[state.idx]; }
function rating(){ return state.ratings[cur().id] || {}; }
function setR(patch){
  state.ratings[cur().id] = Object.assign({}, rating(), patch);
  save(); render();
}
function isRated(id){
  const x = state.ratings[id];
  return !!(x && (x.t || x.h || x.e || x.w));
}
function sloganSize(s){
  const n = s.length;
  if (n <= 30) return 21; if (n <= 45) return 18; if (n <= 62) return 16; if (n <= 80) return 14.5; return 13;
}
function pills(containerId, field){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  const val = rating()[field];
  for (let n = 1; n <= 5; n++){
    const b = document.createElement("button");
    b.className = "pill" + (val === n ? " on" : "");
    b.textContent = n;
    b.onclick = () => { const p = {}; p[field] = (val === n ? null : n); setR(p); };
    el.appendChild(b);
  }
}
function render(){
  const d = cur(), r = rating();
  const rated = DAYS.filter(x => isRated(x.id)).length;
  document.getElementById("count").textContent = rated + "/" + DAYS.length + " rated";
  document.getElementById("prog").style.width = (rated / DAYS.length * 100) + "%";
  document.getElementById("daydate").innerHTML = d.date + ' <small>· ' + d.dow + '</small>';
  document.getElementById("daymeta").textContent = "DAY " + (DAYS.length - state.idx) + " OF " + DAYS.length + " · 2026";
  const slog = document.getElementById("slogan");
  slog.textContent = d.slogan;
  slog.style.fontSize = sloganSize(d.slogan) + "px";
  document.getElementById("ctx").textContent = d.context;
  const a = document.getElementById("srclink");
  a.href = d.url; a.textContent = "read the story · " + d.source + " ↗";
  document.getElementById("saved").style.display = isRated(d.id) ? "block" : "none";
  document.getElementById("prev").disabled = state.idx === 0;
  document.getElementById("next").disabled = state.idx === DAYS.length - 1;
  pills("t","t"); pills("h","h"); pills("e","e");
  document.getElementById("wY").className = "wearbtn" + (r.w === "Y" ? " on" : "");
  document.getElementById("wN").className = "wearbtn" + (r.w === "N" ? " on" : "");
  const tagsEl = document.getElementById("tags");
  tagsEl.innerHTML = "";
  TAGS.forEach(tag => {
    const on = (r.tags || []).includes(tag);
    const b = document.createElement("button");
    b.className = "tag" + (on ? " on" : "");
    b.textContent = tag;
    b.onclick = () => {
      const curTags = rating().tags || [];
      setR({ tags: on ? curTags.filter(t => t !== tag) : curTags.concat([tag]) });
    };
    tagsEl.appendChild(b);
  });
  document.getElementById("crown").className = "crown" + (r.crown ? " on" : "");
  document.getElementById("kill").className = "kill" + (r.kill ? " on" : "");
  document.getElementById("note").innerHTML = DAYS.length + " verified days on the rack (May 7 → Aug 11, 2026).<br/>With sync on, every tap lands in ratings.json — tell Claude “check the rack” anytime.";
}

document.getElementById("prev").onclick = () => { if (state.idx > 0){ state.idx--; saveLocal(); render(); } };
document.getElementById("next").onclick = () => { if (state.idx < DAYS.length - 1){ state.idx++; saveLocal(); render(); } };
document.getElementById("wY").onclick = () => setR({ w: rating().w === "Y" ? null : "Y" });
document.getElementById("wN").onclick = () => setR({ w: rating().w === "N" ? null : "N" });
document.getElementById("crown").onclick = () => setR({ crown: !rating().crown, kill: false });
document.getElementById("kill").onclick = () => setR({ kill: !rating().kill, crown: false });
document.getElementById("nextUnrated").onclick = () => {
  for (let i = 1; i <= DAYS.length; i++){
    const j = (state.idx + i) % DAYS.length;
    if (!isRated(DAYS[j].id)){ state.idx = j; saveLocal(); render(); return; }
  }
};
document.getElementById("copy").onclick = async () => {
  const lines = [];
  for (const d of DAYS){
    const x = state.ratings[d.id];
    if (!x || !isRated(d.id)) continue;
    const parts = [d.date.replace(" ","") + ":"];
    if (x.t) parts.push("T" + x.t);
    if (x.h) parts.push("H" + x.h);
    if (x.e) parts.push("E" + x.e);
    if (x.w) parts.push("W-" + x.w);
    if (x.crown) parts.push("🏆");
    if (x.kill) parts.push("💀");
    if (x.tags && x.tags.length) parts.push(x.tags.join(" "));
    lines.push(parts.join(" "));
  }
  const text = lines.length ? "TEE RATINGS\n" + lines.join("\n") : "No ratings yet.";
  const btn = document.getElementById("copy");
  const done = () => { btn.textContent = "COPIED ✓"; btn.classList.add("done"); setTimeout(() => { btn.textContent = "COPY RESULTS"; btn.classList.remove("done"); }, 1800); };
  try { await navigator.clipboard.writeText(text); done(); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); done();
  }
};

if (token) {
  document.getElementById("tok").placeholder = "token saved on this device";
  setSyncStatus("", "connecting…");
}
render();
pullRemote().then(() => { if (token) pushRemote(); });
</script>
</body>
</html>
